# On every app push to main: build the image and open a deployment PR.
# Argo CD deploys the image after that manifest-only PR is merged.
name: build-and-deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - deploy/kustomization.yaml
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pull-requests: write

concurrency:
  group: build-and-deploy
  cancel-in-progress: false

jobs:
  build:
    # Only in your copy: the template repo itself keeps its placeholders.
    if: github.repository != 'skyhook-io/cnh-starter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Image name and tag
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ steps.meta.outputs.tag }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Open deployment pull request
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Base the image-only change on current main. Each attempt gets its own
          # branch, so retries never force-push over a PR somebody is reviewing.
          git fetch -q origin main
          branch="deploy/image-${TAG}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git checkout -b "$branch" FETCH_HEAD
          yq -i '(.images[] | select(.name == "app")) |= (.newName = strenv(IMAGE) | .newTag = strenv(TAG))' deploy/kustomization.yaml
          if git diff --quiet -- deploy/kustomization.yaml; then exit 0; fi
          git add deploy/kustomization.yaml
          git commit -m "deploy: ${TAG}"
          git push -u origin "$branch"
          printf 'Deploy image `%s:%s` built from commit `%s`.\n\nBuild: %s/%s/actions/runs/%s\n\nThis PR changes only the image reference. Merging it lets Argo CD roll out the build; the manifest-only change does not trigger another image build.\n' \
            "$IMAGE" "$TAG" "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/deployment-pr.md"
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
            --title "deploy: ${TAG}" --body-file "$RUNNER_TEMP/deployment-pr.md"
