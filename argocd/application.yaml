# Create this once, and Argo CD deploys deploy/ on every push to main.
# Ask your agent to apply it through Radar's MCP server (apply_resource), or
# apply it from Radar Cloud. Your repo must be public so Argo CD can read it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app
  namespace: team-stg-fryte
spec:
  project: team-stg-fryte
  source:
    repoURL: https://github.com/stg-fryte/infra.git
    targetRevision: main
    path: deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: team-stg-fryte
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
