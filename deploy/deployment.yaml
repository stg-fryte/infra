apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app: app
spec:
  # Remove this line when you turn on the HPA (examples/hpa), or Argo CD and
  # the autoscaler will keep resetting each other.
  replicas: 2
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "9464"
    spec:
      containers:
        - name: app
          image: app
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9464
          env:
            - name: TEAM_NAME
              value: "stg-fryte"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-app
                  key: uri
            # Elasticsearch (Elastic Cloud Serverless). Optional: when the
            # secret is absent the app falls back to client-side search.
            - name: ES_URL
              valueFrom:
                secretKeyRef:
                  name: es-credentials
                  key: url
                  optional: true
            - name: ES_API_KEY
              valueFrom:
                secretKeyRef:
                  name: es-credentials
                  key: api_key
                  optional: true
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: dash0-telemetry
                  key: endpoint
                  optional: true
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: dash0-telemetry
                  key: headers
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
