<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Event map</title></head><body>
<section class="map-workbench event-workbench" aria-label="Event details and venue map">
 <aside class="map-controls" id="venue-controls">
  <div class="map-panel-heading"><div><h2>Your event, in view</h2><p>Details and a place to go.</p></div></div>
  <div class="map-control-group">
   <label for="map-event">Choose an event</label>
   <select id="map-event"><option value="">Explore without an event</option></select>
  </div>
  <section id="event-details" aria-live="polite" aria-label="Selected event details"></section>
  <div class="map-control-group map-navigation">
   <label for="venue">Venue</label>
   <select id="venue"><option>Salt Palace</option><option>Hyatt Regency</option></select>
   <label for="floor">Floor</label><select id="floor"></select>
   <button id="show-destination" class="map-fit" hidden>Show event location</button>
   <button id="floor-overview" class="map-fit">View floor overview</button>
   <button id="fit" class="map-fit">Show whole floor</button>
  </div>
  <p class="map-source-note">PDF floor plans are schematic. Highlights show rooms, not walking routes.</p>
  <a class="purple-link" href="https://assets.simpleviewinc.com/simpleview/image/upload/v1/clients/saltlake/SPCC_Brochure_2021_f18cc627-99e8-4ecd-87ed-d65c4aebdcae.pdf" target="_blank" rel="noopener">Salt Palace source drawing ↗</a>
 </aside>
 <section class="map-surface event-map-surface" aria-label="Event location">
  <div class="map-context"><span><strong id="map-context-venue">Salt Palace</strong></span><span id="map-context-floor">Level 1</span></div>
  <div id="map" aria-label="Top-down PDF floor map"></div>
  <div id="floor-stack" aria-label="Choose a floor" hidden></div>
  <div id="map-empty" hidden></div>
  <p id="map-status" role="status" aria-live="polite"></p>
 </section>
</section>
<script type="application/json" id="map-data"><!-- MAP_DATA --></script>
<script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script defer src="/static/floor-plans.js"></script>
<script defer src="/static/venue-map.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
 if (!window.VenueMap) {
  document.getElementById('map-status').textContent = 'The map could not load. Refresh to try again.';
  return;
 }
 VenueMap.mount(JSON.parse(document.getElementById('map-data').textContent));
});
</script>
</body></html>
